; Nodo del almacen: ESP32 + tira WS2812B, suscrito por MQTT a AWS IoT Core.
;
;   pio run                 compila
;   pio run -t upload       compila y graba la placa
;   pio device monitor      ver el registro por el puerto serie
;
; Antes de compilar: copia include/config.example.h a include/config.h y llenalo.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -Wall
